services:
  postgres:
    image: postgres:16
    container_name: transaction-processor-postgres
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - transaction_data:/var/lib/postgresql/data
  app:
    build: .
    container_name: transaction-processor-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transactions
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    ports:
      - "8080:8080"
volumes:
  transaction_data:
